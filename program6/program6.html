<!doctype html>
<html>
<body>
<center>
<h2><u><font color="red">STRING METHOD</u></h2></center><center>
<p><b>java script string method<b></p>
<script> var name="i am arundhati m p";
document.write(name);
document.write("lengthy of the string is:");
document.write(name.length);
document.write("<br/>");
document.write("index of first occurence of a string is:");
document.write(name.indexOf("a"));
document.write("<br/>");
document.write("index of last occurance of a string is:");
document.write(name.lastIndexOf("a"));
document.write("<br/>");
document.write("index of an string :");
document.write(name.search("am"));
document.write("<br/>");
document.write("index 0 to 3 print using slice:");
document.write(name.slice(0,4));
document.write("<br/>");
document.write("to get substring of string using substring:");
document.write(name.substr(0,8));
document.write("<br/>");
document.write("to get substring of string using substring:");
document.write(name.substr(0,3));
document.write("<br/>");
document.write("string to uppercase");
document.write(name.toUpperCase());
document.write("<br/>")
document.write("replace arundhati to aswathi string");
document.write(name.replace("arundhati m p","aswathi"));
document.write("<br/>");
document.write("use trim:");
document.write(name.trim());
document.write("<br/>");
document.write("new string that have charcater 5 on string:");
document.write(name.charAt(5));
document.write("<br/>");
document.write("print numeric ASSI value of character 5 on string");
document.write(name.charCodeAt(5));
document.write("</br>");
</script>
<h2><u>MATH OBJECT</u></h2>
<p><b>math object is a build in object,contains basic mathematical functions and constents<b></P>
<script type="text/javascript">
document.write("value of PI in radian:");
document.write(Math.PI);
document.write("</br>");
document.write("PI in degree:");
document.write(Math.PI*180/Math.PI);
document.write("</br>");
document.write(" value of E:");
document.write(Math.E);
document.write("</br>");
document.write("square root of number is:");
document.write(Math.sqrt(8));
document.write("</br>");
document.write("the 2nd power of 8 is:");
document.write(Math.pow(8,2));
document.write("</br>");
document.write("round the value 6.7 is:");
document.write(Math.round(6.7));
document.write("</br>");
document.write("round the value 4.6 is:");
document.write(Math.round(4.6));
document.write("</br>");
document.write("ceil the value 4.4 is:");
document.write(Math.ceil(4.4));
document.write("</br>");
document.write("the floor the value 4.4 is:");
document.write(Math.floor(4.4));
document.write("</br>");
</script>
