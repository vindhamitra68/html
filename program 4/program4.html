<!doctype html>
<html>
<head>
<title> registration form</title>
<style>
table{
width:60%;
font-size:18px;
margin-left:50px;
}
tr,th,td{
padding:15px;
}
</style>
</head>
<body bgcolor="nav-blue">
<form>
<table>
<tr>
<th colspan="1">registration form</th>
</tr>
<tr>
<td>full name</td>
<td colspan="2"><input type="text" name="full name"></td>
</tr>
<tr>
<td>mobile number</td>
<td colspan="2"><input type="text" name="mobile number"></td>
</tr>
<tr>
<td>email id</td>
<td colspan="2"><input type="text" name="age"></td>
</tr>
<tr>
<td> gender</td>
<td colspan="2"><input type="radio" name="gender">male
<input type="radio" name="gender">female
<input type="radio"name="gender">others
</td>
<tr>
<td>Date Of Birth</td>
<td colspan="2"><input type="date" name="dob"></td>
</tr>
<tr>
<td>Address</td>
<td colspan="2"><textarea cols="30"  rows="10"></textarea></td>
</tr>
<tr>
<td>current study</td>
<td>
<select name="course">
<option value="btech">b.tech</option>
<option value="bsc">bsc</option>
<option value="msc">msc</option>
<option value="mca">mca</option>
</select>
</td>
</tr>
<tr>
<td>department/td>
<td colspan="2">
<select name="department">
<option value="cs">cse</option>
<option value="ece">ece</option>
<option value="cs">cs</option>
<option value="mca">mca</option>
<option value="maths">maths</option>
<option value="physics">physics</option>
</select>
</td>
</tr>
<tr>
<td>upload cv</td>
<td colspan="2"><input type="file" name="cv-file"></td>
</tr>
<tr>
<td>programming langauages</td>
<td colspan="2"><input type="checkbox" name="code">html
<input type="Checkbox" name="code">reactjs
<input type="Checkbox" name="code">css
<input type="Checkbox" name="code">flutter
</td>
</tr>
<tr>
<td> language</td>
<td colspan="2">
<input type="Checkbox" name="lang">malayalam
<input type="Checkbox" name="lang">english
<input type="Checkbox" name="lang">arabic
<input type="Checkbox" name="lang">hindi

</td>
</tr>
<tr>
<td colspan="1"><input id="btn" type="submit" value="submit"></td>
<td colspan="2"><input id="btn" type="reset" value="reset"></td>
</tr>
</table>
</form>
</body>
</html>
